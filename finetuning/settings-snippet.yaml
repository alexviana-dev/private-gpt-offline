# settings/settings.yaml is git-ignored, so the two changes that point
# PrivateGPT at the fine-tuned model are recorded here.

llm:
  mode: openai
  default_model: llama3.1-birds        # was: llama3.1:8b

models:
  # ...the existing llama3.1:8b entry stays as it is; add this one after it:
  - type: llm
    name: llama3.1-birds
    mode: openai
    provider: ollama
    enabled: true
    alias: llama3.1-birds
    context_window: 4096
    prompt_style: chat
    tokenizer_mode: default
    api_type: chat_completions
    sampling_params:
      seed: 0
      temperature: 0.1
      max_new_tokens: 512
